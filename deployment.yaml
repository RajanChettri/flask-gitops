apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-app
  namespace: flask-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
        - name: flask-container

          image: ghcr.io/rajanchettri/flask-app:v1

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000
              name: http

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20